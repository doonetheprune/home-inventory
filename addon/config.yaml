# Home Assistant add-on for Larder. Uses the same image as the standalone
# Docker install, published by .github/workflows/release.yml.
name: Larder
version: "0.4.1"
slug: larder
description: What you've got, and where. A home inventory for everything in the house.
url: https://github.com/doonetheprune/home-inventory
arch:
  - aarch64
  - amd64
image: ghcr.io/doonetheprune/home-inventory
# Opened from the Home Assistant sidebar, signed in as the Home Assistant user.
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:package-variant-closed
panel_title: Larder
# In everyone's sidebar, not only Home Assistant admins': the whole household uses it.
# Who can change Larder's settings is the "Larder admins" option.
panel_admin: false
# Lets Larder tell Home Assistant where it is, so the integration sets itself up.
hassio_api: true
# Installs and updates the Larder integration in Home Assistant's custom_components folder
# (the "Install the Home Assistant integration" option), and asks for a restart afterwards.
map:
  - type: homeassistant_config
    read_only: false
homeassistant_api: true
discovery:
  - larder
# The Mosquitto broker add-on, if installed, for Larder's optional MQTT module.
services:
  - mqtt:want
# Off by default. Open it for MCP clients, scripts and Node-RED on your network (they need an access token).
ports:
  8080/tcp: null
# Home Assistant backups include Larder's data; Larder's own extra copies don't need backing up again.
backup_exclude:
  - backups/*
options:
  log_level: info
  backups: false
  admins: []
  disabled_modules: []
  env_vars: []
  install_integration: true
schema:
  log_level: list(trace|debug|info|warn|error)
  backups: bool
  base_url: url?
  demo: bool?
  admins:
    - str
  disabled_modules:
    - str
  env_vars:
    - name: match(^LARDER_[A-Z0-9_]+$)
      value: str
  install_integration: bool
