# Python is only used for the Home Assistant integration (custom_components/larder)
# and its tests (tests/ha). Everything else is TypeScript; see package.json.
[tool.pytest.ini_options]
testpaths = ["tests/ha"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint.isort]
# Home Assistant's import style.
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
