# Run Larder on its own:   docker compose up -d   then open http://localhost:8080
# Everything Larder keeps (database, photos, backups) is in ./larder-data.
services:
  larder:
    image: ghcr.io/doonetheprune/home-inventory:latest
    build: .
    container_name: larder
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./larder-data:/data
    environment:
      # "local" = household accounts and access tokens (recommended).
      LARDER_AUTH: local
      # Your HTTPS address, used in QR labels. Cameras need HTTPS to scan.
      # LARDER_BASE_URL: https://larder.example.com
      # Behind a reverse proxy or Tailscale on this machine, trust it (Docker's network):
      # LARDER_TRUST_PROXY: 172.16.0.0/12
      # Load the example household into an empty Larder:
      # LARDER_DEMO: "true"
