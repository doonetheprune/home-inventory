# Generated by `npm run ha:services` from Larder's actions. Don't edit by hand.
add_stock:
  name: "Add stock"
  description: "Add some of an item to stock, e.g. after shopping."
  fields:
    item:
      name: "Item"
      description: "The item: its name or alias (\"loo roll\"), barcode, or id"
      required: true
      selector:
        text: {}
    quantity:
      name: "Quantity"
      description: "How many, in the item's own unit (default 1)"
      required: false
      default: 1
      selector:
        number:
          mode: "box"
          min: 0
          step: "any"
    place:
      name: "Place"
      description: "Where it goes: a place name or code like \"G2-4\". Defaults to its usual place."
      required: false
      selector:
        text: {}
    expires_on:
      name: "Expires on"
      description: "Expiry date (YYYY-MM-DD). Defaults to today plus its shelf life."
      required: false
      selector:
        date: {}
    note:
      name: "Note"
      description: ""
      required: false
      selector:
        text: {}
    config_entry_id:
      name: "Larder"
      description: "Only needed when Home Assistant is linked to more than one Larder."
      required: false
      advanced: true
      selector:
        config_entry:
          integration: "larder"
