name: Board

# Rebuilds every project's BOARD.md after each push to main. Pushes made with
# GITHUB_TOKEN don't start another run, so this can't loop.
on:
  push:
    branches: [main]
    paths: ['projects/**', 'scripts/board.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the boards
        run: |
          for p in projects/*/; do
            case "$(basename "$p")" in _*) continue ;; esac
            node scripts/board.mjs "$p"
          done
      - name: Commit them if they changed
        run: |
          if [ -z "$(git status --porcelain -- 'projects/*/BOARD.md')" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/*/BOARD.md
          git commit -m "Update boards"
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
